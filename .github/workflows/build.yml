name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier une release sur un tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XFILES_VERSION_CODE: ${{ github.run_number }}
      # Sur un tag v1.2.3 → 1.2.3 ; sinon dev-<sha court>
      XFILES_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
      # Google Drive : identifiant d'application « bureau » d'XFiles (variables du dépôt, facultatives).
      XFILES_GDRIVE_CLIENT_ID: ${{ vars.XFILES_GDRIVE_CLIENT_ID }}
      XFILES_GDRIVE_CLIENT_SECRET: ${{ vars.XFILES_GDRIVE_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Pont rclone (comptes en ligne) : Go et le NDK Android pour gomobile.
      - uses: actions/setup-go@v6
        with:
          go-version-file: rclone/go.mod
          cache-dependency-path: rclone/go.sum

      # NDK figé (gomobile et libarchive) ; cmake et ninja pour libarchive, zlib pour sa version de test.
      - name: NDK Android, cmake et ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zlib1g-dev
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: Nom de version
        run: |
          name="$XFILES_VERSION_NAME"
          name="${name#v}"           # v1.2.3 → 1.2.3
          case "$name" in dev-*) name="dev-${GITHUB_SHA::7}";; esac
          echo "XFILES_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "Version : $name (code $XFILES_VERSION_CODE)"

      - name: Tests du pont rclone
        working-directory: rclone
        run: ./patch.sh && go test ./...

      - name: Tests et APK debug
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Clé de signature
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XFILES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas de secret XFILES_KEYSTORE_BASE64 : APK release non signé ignoré."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles.jks"
          echo "XFILES_KEYSTORE_FILE=$RUNNER_TEMP/xfiles.jks" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: APK release signé
        if: steps.keystore.outputs.available == 'true'
        env:
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.XFILES_KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.XFILES_KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.XFILES_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          # Universel (tous les téléphones) ; arm64 : la plupart des téléphones depuis 2017, plus léger.
          out=app/build/outputs/apk/release
          mv "$out/app-universal-release.apk" "$out/xfiles-${XFILES_VERSION_NAME}.apk"
          mv "$out/app-arm64-v8a-release.apk" "$out/xfiles-${XFILES_VERSION_NAME}-arm64.apk"
          mv "$out/app-armeabi-v7a-release.apk" "$out/xfiles-${XFILES_VERSION_NAME}-armv7.apk"
          mv "$out/app-x86_64-release.apk" "$out/xfiles-${XFILES_VERSION_NAME}-x86_64.apk"

      - name: Artefact debug
        uses: actions/upload-artifact@v5
        with:
          name: xfiles-debug-${{ env.XFILES_VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Artefact release
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: xfiles-release-${{ env.XFILES_VERSION_NAME }}
          path: app/build/outputs/apk/release/xfiles-*.apk

      - name: Notes de version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Section « ## [x.y.z] » du CHANGELOG, jusqu'à la section suivante.
          awk -v v="$XFILES_VERSION_NAME" '
            /^## \[/ { inside = index($0, "[" v "]") > 0; next }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publication GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: XFiles ${{ env.XFILES_VERSION_NAME }}
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/outputs/apk/release/xfiles-*.apk

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/xfiles.jks"
